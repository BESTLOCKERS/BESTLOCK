<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Crown Feedback & Admin Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Custom CSS for animations and fonts */
        body {
            font-family: 'Inter', sans-serif;
            overflow-y: auto;
            min-height: 100vh;
        }

        /* Winter Crown and Feedback Text Styles */
        .winter-crown-text {
            font-family: 'Georgia', serif; /* Or any other regal serif font you like */
            text-shadow: 0 0 10px rgba(255,255,255,0.7), 0 0 20px rgba(173,216,230,0.5), 0 0 30px rgba(0,0,139,0.3); /* Icy glow */
            background: linear-gradient(to right, #ADD8E6, #FFFFFF, #ADD8E6); /* Light blue to white gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feedback-text {
            font-family: 'Georgia', serif; /* Consistent with Winter Crown */
            text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 15px rgba(173,216,230,0.4); /* Subtle icy glow */
            background: linear-gradient(to right, #B0E0E6, #F0F8FF, #B0E0E6); /* Powder blue to alice blue gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes pulse-once {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pulse-once {
            animation: pulse-once 1.5s ease-out 1;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 4s infinite ease-in-out;
        }

        /* Background specific styles */
        .background-container {
            position: fixed; /* Fixes background to viewport */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Contains background elements */
            background: radial-gradient(circle at top left, rgba(0,20,50,1) 0%, rgba(0,0,0,1) 50%); /* Dark, deep radial gradient */
        }

        /* Snowflake styles for JavaScript animation */
        .snowflake {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: fade-in-snowflake linear infinite;
        }

        @keyframes fade-in-snowflake {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(100vh); }
        }

        /* Utility classes for smooth transitions */
        .fade-out-up {
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
            pointer-events: none; /* Disable interaction during fade-out */
        }
        .fade-in-down {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        /* Hidden utility class, use in conjunction with fade-out-up / fade-in-down */
        .hidden-element {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start relative p-4 text-white">

    <!-- Super Cool Background Container (Fixed to viewport) -->
    <div class="background-container">
        <!-- Optional: Background elements for subtle movement via CSS if needed, or controlled by JS -->
    </div>

    <!-- Main Content Container (Feedback UI / Login / Admin Panel) -->
    <div id="mainContentContainer" class="relative z-30 bg-white bg-opacity-10 backdrop-filter backdrop-blur-md rounded-3xl shadow-2xl p-8 md:p-12 w-full max-w-md border border-opacity-20 border-white flex flex-col items-center mt-20 mb-20 animate-fade-in">
        <!-- Content will be dynamically inserted here by JavaScript -->
    </div>

    <script>
        // Global state for views and feedback (in-memory, not persistent)
        let currentView = 'feedback'; // 'feedback', 'login', 'admin'
        let feedbackEntries = []; // Stores feedback objects: { id, username, message, timestamp, imageUrls: [{name, url}] }
        let currentUserId = null; // Simulated user login state

        // Hardcoded Admin Credentials
        const ADMIN_EMAIL = "WhiteCrownAdmin@gmail.com";
        const ADMIN_PASSWORD = "ADMIN1";

        // DOM Elements
        let mainContentContainer;

        // --- View Rendering Functions ---
        function renderView() {
            if (!mainContentContainer) {
                mainContentContainer = document.getElementById('mainContentContainer');
            }
            mainContentContainer.innerHTML = ''; // Clear current content

            if (currentView === 'feedback') {
                renderFeedbackUI();
            } else if (currentView === 'login') {
                renderLoginUI();
            } else if (currentView === 'admin') {
                renderAdminPanelUI();
            }
        }

        function renderFeedbackUI() {
            mainContentContainer.classList.remove('max-w-2xl'); // For admin panel
            mainContentContainer.classList.add('max-w-md'); // For feedback/login

            mainContentContainer.innerHTML = `
                <img
                    src="https://i.imgur.com/xhpaHq8.jpeg"
                    alt="Winter Crown Logo"
                    class="w-28 h-28 object-contain mb-4 -mt-16 animate-bounce-slow drop-shadow-xl"
                    onerror="this.onerror=null; this.src='https://placehold.co/120x120?text=Logo+Error';"
                />
                <h1 class="text-5xl md:text-6xl font-extrabold text-white mb-2 text-center tracking-wider drop-shadow-lg winter-crown-text">
                    WINTER CROWN
                </h1>
                <h2 class="text-4xl md:text-5xl font-extrabold text-white mb-8 text-center tracking-wide drop-shadow-lg feedback-text">
                    FEEDBACK
                </h2>
                <div id="feedbackStartSection" class="w-full flex flex-col items-center fade-in-down">
                    <button id="sendFeedbackButton"
                        class="relative px-10 py-5 bg-gradient-to-r from-blue-500 to-blue-700 text-white font-bold text-lg rounded-full shadow-lg hover:shadow-xl transform transition-all duration-300 ease-in-out hover:scale-105 active:scale-95 overflow-hidden group border border-blue-400 animate-pulse-once">
                        Send Feedback
                        <span class="absolute top-0 left-0 w-full h-full bg-white opacity-0 group-hover:opacity-20 transition-all duration-700 transform -translate-x-full group-hover:translate-x-full rotate-45"></span>
                    </button>
                    <button id="adminLoginButton"
                        class="mt-4 text-sm text-blue-200 hover:text-blue-100 transition-colors duration-200">
                        Admin Login
                    </button>
                </div>
                <form id="feedbackForm" class="w-full space-y-6 hidden-element fade-out-up">
                    <div>
                        <label for="telegramUsername" class="block text-sm font-medium text-blue-200 mb-1">Telegram Username:</label>
                        <input type="text" id="telegramUsername" placeholder="@VALID USERNAME" class="w-full px-4 py-2 bg-white bg-opacity-20 border border-blue-400 rounded-lg focus:ring-blue-300 focus:border-blue-300 shadow-md placeholder-blue-200 text-white transition duration-300 ease-in-out hover:border-blue-300 focus:outline-none" required />
                    </div>
                    <div>
                        <label for="feedbackMessage" class="block text-sm font-medium text-blue-200 mb-1">Message Here:</label>
                        <textarea id="feedbackMessage" rows="4" placeholder="Type your feedback here..." class="w-full px-4 py-2 bg-white bg-opacity-20 border border-blue-400 rounded-lg focus:ring-blue-300 focus:border-blue-300 shadow-md placeholder-blue-200 text-white transition duration-300 ease-in-out hover:border-blue-300 focus:outline-none resize-y" required></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-blue-200 mb-2">Upload Gameplay Screenshots (Optional):</label>
                        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" />
                        <button type="button" id="chooseFilesButton" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 active:scale-95">Choose Files</button>
                        <div id="filePreviews" class="mt-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
                    </div>
                    <button type="submit" id="submitFeedbackButton" class="w-full px-6 py-3 rounded-full font-bold text-white transition-all duration-300 ease-in-out shadow-lg hover:shadow-xl transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700">
                        <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden-element" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <span id="submitButtonText">Submit Feedback</span>
                    </button>
                    <p id="userMessage" class="mt-4 text-center font-semibold text-sm hidden-element"></p>
                    <button type="button" id="backButton" class="w-full text-center text-sm text-blue-200 mt-4 hover:text-blue-100 transition-colors duration-200">Back</button>
                </form>
            `;
            attachFeedbackEventListeners();
        }

        function renderLoginUI() {
            mainContentContainer.classList.remove('max-w-2xl');
            mainContentContainer.classList.add('max-w-md');

            mainContentContainer.innerHTML = `
                <h2 class="text-3xl font-bold text-white mb-6 text-center winter-crown-text">Admin Login</h2>
                <form id="loginForm" class="w-full space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-blue-200 mb-1">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Enter admin email" class="w-full px-4 py-2 bg-white bg-opacity-20 border border-blue-400 rounded-lg focus:ring-blue-300 focus:border-blue-300 shadow-md placeholder-blue-200 text-white transition duration-300 ease-in-out" required />
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-blue-200 mb-1">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter admin password" class="w-full px-4 py-2 bg-white bg-opacity-20 border border-blue-400 rounded-lg focus:ring-blue-300 focus:border-blue-300 shadow-md placeholder-blue-200 text-white transition duration-300 ease-in-out" required />
                    </div>
                    <p id="loginError" class="text-red-300 text-center text-sm hidden-element"></p>
                    <button type="submit" class="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 active:scale-95">Login</button>
                </form>
                <button id="backToFeedbackButton" class="mt-4 text-sm text-blue-200 hover:text-blue-100 transition-colors duration-200">Back to Feedback</button>
            `;
            attachLoginEventListeners();
        }

        function renderAdminPanelUI() {
            mainContentContainer.classList.remove('max-w-md');
            mainContentContainer.classList.add('max-w-2xl'); // Wider for admin panel

            mainContentContainer.innerHTML = `
                <h2 class="text-3xl font-bold text-white mb-6 text-center winter-crown-text">Admin Panel</h2>
                <button id="logoutButton" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full shadow-lg transition duration-300 ease-in-out self-end">Logout</button>
                <h3 class="text-xl font-semibold text-blue-200 mt-8 mb-4">Submitted Feedback</h3>
                <div id="feedbackListContainer" class="w-full space-y-6 max-h-[50vh] overflow-y-auto pr-2">
                    ${feedbackEntries.length === 0 ? `<p class="text-gray-300">No feedback submitted yet.</p>` : ''}
                </div>
                <button id="backToFeedbackFormButton" class="mt-8 text-sm text-blue-200 hover:text-blue-100 transition-colors duration-200">Back to Feedback Form</button>
            `;
            attachAdminEventListeners();
            displayFeedbackList();
        }

        function displayFeedbackList() {
            const feedbackListContainer = document.getElementById('feedbackListContainer');
            feedbackListContainer.innerHTML = ''; // Clear list before re-rendering

            if (feedbackEntries.length === 0) {
                feedbackListContainer.innerHTML = `<p class="text-gray-300">No feedback submitted yet.</p>`;
                return;
            }

            feedbackEntries.forEach(feedback => {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'bg-white bg-opacity-10 p-4 rounded-lg shadow-md border border-blue-600';
                feedbackDiv.innerHTML = `
                    <p class="text-lg font-bold text-blue-100">@${feedback.username}</p>
                    <p class="text-gray-200 mt-2">${feedback.message}</p>
                    <p class="text-gray-400 text-xs mt-2">
                        Submitted: ${new Date(feedback.timestamp).toLocaleString()}
                    </p>
                    ${feedback.imageUrls && feedback.imageUrls.length > 0 ? `
                        <div class="mt-4">
                            <p class="text-blue-300 text-sm mb-2">Attached Screenshots:</p>
                            <div class="grid grid-cols-2 gap-2">
                                ${feedback.imageUrls.map(img => `
                                    <div class="w-full h-24 bg-gray-700 flex items-center justify-center text-xs text-gray-400 rounded-md overflow-hidden">
                                        Simulated Image: ${img.name}
                                    </div>
                                `).join('')}
                            </div>
                            <button data-feedback-id="${feedback.id}" class="download-photos-btn mt-3 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-full transition duration-200">
                                Download All Photos (${feedback.imageUrls.length})
                            </button>
                        </div>
                    ` : ''}
                    <button data-feedback-id="${feedback.id}" class="delete-feedback-btn mt-4 px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold rounded-full transition duration-200">
                        Delete Feedback
                    </button>
                `;
                feedbackListContainer.appendChild(feedbackDiv);
            });

            // Attach event listeners for delete and download buttons *after* they are added to DOM
            feedbackListContainer.querySelectorAll('.delete-feedback-btn').forEach(button => {
                button.addEventListener('click', (event) => handleDeleteFeedback(event.target.dataset.feedbackId));
            });
            feedbackListContainer.querySelectorAll('.download-photos-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    const feedback = feedbackEntries.find(entry => entry.id === event.target.dataset.feedbackId);
                    if (feedback) handleDownloadPhotos(feedback);
                });
            });
        }


        // --- Event Listener Attachments ---
        function attachFeedbackEventListeners() {
            const sendFeedbackButton = document.getElementById('sendFeedbackButton');
            const feedbackStartSection = document.getElementById('feedbackStartSection');
            const feedbackForm = document.getElementById('feedbackForm');
            const adminLoginButton = document.getElementById('adminLoginButton');
            const chooseFilesButton = document.getElementById('chooseFilesButton');
            const fileInput = document.getElementById('fileInput');
            const backButton = document.getElementById('backButton');

            // Hide/Show Feedback Form with smooth transition
            sendFeedbackButton.onclick = () => {
                feedbackStartSection.classList.remove('fade-in-down');
                feedbackStartSection.classList.add('fade-out-up');
                setTimeout(() => { // Hide completely after fade-out
                    feedbackStartSection.classList.add('hidden-element');
                    feedbackForm.classList.remove('hidden-element', 'fade-out-up');
                    feedbackForm.classList.add('fade-in-down');
                }, 300); // Match fade-out duration
            };

            // Go to Admin Login
            adminLoginButton.onclick = () => {
                currentView = 'login';
                renderView();
            };

            // Back from Feedback Form
            backButton.onclick = () => {
                feedbackForm.classList.remove('fade-in-down');
                feedbackForm.classList.add('fade-out-up');
                setTimeout(() => { // Hide completely after fade-out
                    feedbackForm.classList.add('hidden-element');
                    feedbackStartSection.classList.remove('hidden-element', 'fade-out-up');
                    feedbackStartSection.classList.add('fade-in-down');
                    resetFeedbackForm(); // Reset form fields
                }, 300); // Match fade-out duration
            };

            // Trigger file input click
            chooseFilesButton.onclick = () => fileInput.click();
            fileInput.onchange = handleFileChange;
            feedbackForm.onsubmit = handleSubmitFeedback;

            // Initial render of file previews (empty)
            renderFilePreviews();
        }

        function attachLoginEventListeners() {
            const loginForm = document.getElementById('loginForm');
            const backToFeedbackButton = document.getElementById('backToFeedbackButton');

            loginForm.onsubmit = handleLoginAttempt;
            backToFeedbackButton.onclick = () => {
                currentView = 'feedback';
                renderView();
            };
        }

        function attachAdminEventListeners() {
            const logoutButton = document.getElementById('logoutButton');
            const backToFeedbackFormButton = document.getElementById('backToFeedbackFormButton');

            logoutButton.onclick = handleLogout;
            backToFeedbackFormButton.onclick = () => {
                currentView = 'feedback';
                renderView();
            };
        }


        // --- Form/Logic Handlers ---
        let selectedFiles = []; // For feedback form files
        function handleFileChange(event) {
            const newFiles = Array.from(event.target.files);
            selectedFiles = [...selectedFiles, ...newFiles];
            renderFilePreviews();
            event.target.value = ''; // Clear input for re-selection
        }

        function removeFile(indexToRemove) {
            selectedFiles = selectedFiles.filter((_, index) => index !== indexToRemove);
            renderFilePreviews();
        }

        function renderFilePreviews() {
            const filePreviewsContainer = document.getElementById('filePreviews');
            filePreviewsContainer.innerHTML = ''; // Clear existing

            selectedFiles.forEach((file, index) => {
                const previewDiv = document.createElement('div');
                previewDiv.className = 'relative group rounded-lg overflow-hidden shadow-lg border border-blue-500';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = `Screenshot ${index + 1}`;
                img.className = 'w-full h-24 object-cover';
                img.onload = () => URL.revokeObjectURL(img.src);

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'absolute top-1 right-1 bg-red-600 bg-opacity-80 text-white text-xs p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10';
                removeButton.textContent = '×';
                removeButton.setAttribute('aria-label', `Remove file ${file.name}`);
                removeButton.onclick = (event) => {
                    event.stopPropagation(); // Prevent trigger parent click if any
                    removeFile(index);
                };

                previewDiv.appendChild(img);
                previewDiv.appendChild(removeButton);
                filePreviewsContainer.appendChild(previewDiv);
            });
        }

        async function handleSubmitFeedback(event) {
            event.preventDefault();

            const telegramUsernameInput = document.getElementById('telegramUsername');
            const feedbackMessageInput = document.getElementById('feedbackMessage');
            const submitFeedbackButton = document.getElementById('submitFeedbackButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitButtonText = document.getElementById('submitButtonText');
            const userMessageElement = document.getElementById('userMessage');

            const lastSubmissionTime = localStorage.getItem('lastFeedbackSubmission');
            const oneHour = 60 * 60 * 1000; // 1 hour in milliseconds

            if (lastSubmissionTime && (new Date().getTime() - lastSubmissionTime < oneHour)) {
                userMessageElement.textContent = '🚫 Anti-spam: Please wait at least 1 hour before submitting feedback again.';
                userMessageElement.classList.remove('hidden-element', 'text-green-300', 'text-blue-300');
                userMessageElement.classList.add('text-red-300');
                return;
            }

            const username = telegramUsernameInput.value.trim();
            const message = feedbackMessageInput.value.trim();

            if (!username || !message) {
                userMessageElement.textContent = 'Please enter your Telegram username and feedback message.';
                userMessageElement.classList.remove('hidden-element', 'text-green-300', 'text-blue-300');
                userMessageElement.classList.add('text-red-300');
                return;
            }

            // Set submission status to loading
            submitFeedbackButton.disabled = true;
            submitFeedbackButton.classList.add('bg-gray-500', 'cursor-not-allowed');
            loadingSpinner.classList.remove('hidden-element');
            submitButtonText.textContent = 'Submitting...';
            userMessageElement.classList.remove('hidden-element', 'text-red-300', 'text-green-300');
            userMessageElement.classList.add('text-blue-300');
            userMessageElement.textContent = 'Submitting feedback...';

            // --- SIMULATED FEEDBACK STORAGE ---
            const newFeedback = {
                id: Date.now().toString(), // Simple unique ID
                username: username,
                message: message,
                timestamp: new Date().getTime(),
                imageUrls: selectedFiles.map(file => ({
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    url: `simulated-url://${file.name}` // Placeholder URL
                }))
            };
            feedbackEntries.push(newFeedback); // Add to in-memory array
            // Sort to ensure newest is first in admin panel
            feedbackEntries.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            localStorage.setItem('lastFeedbackSubmission', new Date().getTime()); // Update cooldown

            console.log('--- SIMULATED FEEDBACK SUBMISSION ---');
            console.log('New Feedback Submitted (In-memory only):', newFeedback);
            console.log('Current Feedback List:', feedbackEntries);
            console.log('--- END SIMULATION ---');

            // Simulate network request delay
            setTimeout(() => {
                // Success state
                userMessageElement.textContent = '✅ Feedback submitted successfully! (Simulated)';
                userMessageElement.classList.remove('text-red-300', 'text-blue-300');
                userMessageElement.classList.add('text-green-300');

                resetFeedbackForm(); // Clear form

                // Reset button and hide form after a delay
                setTimeout(() => {
                    // Smooth transition back to initial state
                    const feedbackStartSection = document.getElementById('feedbackStartSection');
                    const feedbackForm = document.getElementById('feedbackForm');

                    feedbackForm.classList.remove('fade-in-down');
                    feedbackForm.classList.add('fade-out-up');
                    setTimeout(() => { // Hide completely after fade-out
                        feedbackForm.classList.add('hidden-element');
                        feedbackStartSection.classList.remove('hidden-element', 'fade-out-up');
                        feedbackStartSection.classList.add('fade-in-down');

                        submitFeedbackButton.disabled = false;
                        submitFeedbackButton.classList.remove('bg-gray-500', 'cursor-not-allowed');
                        loadingSpinner.classList.add('hidden-element');
                        submitButtonText.textContent = 'Submit Feedback';
                        userMessageElement.classList.add('hidden-element');
                        userMessageElement.textContent = '';
                    }, 300); // Match fade-out duration
                }, 2000);
            }, 1500); // Simulate 1.5 seconds delay
        }

        function resetFeedbackForm() {
            document.getElementById('telegramUsername').value = '';
            document.getElementById('feedbackMessage').value = '';
            selectedFiles = []; // Clear selected files array
            renderFilePreviews(); // Clear previews
        }

        async function handleLoginAttempt(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginErrorElement = document.getElementById('loginError');

            if (emailInput.value === ADMIN_EMAIL && passwordInput.value === ADMIN_PASSWORD) {
                currentUserId = 'admin-user'; // Simulate login
                currentView = 'admin';
                renderView();
            } else {
                loginErrorElement.textContent = 'Invalid credentials. Please try again.';
                loginErrorElement.classList.remove('hidden-element');
            }
        }

        function handleLogout() {
            currentUserId = null; // Simulate logout
            currentView = 'feedback';
            renderView();
            console.log("Admin logged out.");
        }

        function handleDeleteFeedback(id) {
            if (confirm('Are you sure you want to delete this feedback?')) {
                feedbackEntries = feedbackEntries.filter(entry => entry.id !== id);
                displayFeedbackList(); // Re-render the list
                console.log(`Simulated deletion of feedback ID: ${id}. Remaining feedback:`, feedbackEntries);
            }
        }

        function handleDownloadPhotos(feedbackEntry) {
            console.log("--- SIMULATING PHOTO DOWNLOAD ---");
            console.log(`Attempting to 'download' photos for feedback ID: ${feedbackEntry.id}`);
            if (feedbackEntry.imageUrls && feedbackEntry.imageUrls.length > 0) {
                feedbackEntry.imageUrls.forEach((img, index) => {
                    console.log(`Simulated download of image ${index + 1}: Name=${img.name}, URL=${img.url}`);
                });
                alert(`Simulated download complete for ${feedbackEntry.imageUrls.length} images. Check console for details.`);
            } else {
                alert("No photos attached to this feedback entry for download.");
            }
            console.log("--- END SIMULATED PHOTO DOWNLOAD ---");
        }

        // --- Initial Setup on DOM Load ---
        document.addEventListener('DOMContentLoaded', () => {
            mainContentContainer = document.getElementById('mainContentContainer');
            renderView(); // Render the initial view

            // Snowflake animation (as before)
            const backgroundContainer = document.querySelector('.background-container');
            function createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                const size = Math.random() * 5 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                snowflake.style.left = `${Math.random() * 100}vw`;
                snowflake.style.animationDuration = `${Math.random() * 5 + 5}s`;
                snowflake.style.animationDelay = `${-Math.random() * 5}s`;
                backgroundContainer.appendChild(snowflake);

                snowflake.addEventListener('animationend', () => {
                    snowflake.remove();
                });
            }
            setInterval(createSnowflake, 200);
        });
    </script>
</body>
</html>
